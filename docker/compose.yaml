# Example deployment (design §9.4). Run `docker compose up -d` from this directory with a .env
# file holding VISUALSTORE_PASSWORD (see ../.env.example).
# Use the same container-side media paths on the initialisation machine and on the NAS.
services:
  visualstore:
    image: ghcr.io/secretnest/visualstore:latest
    container_name: visualstore
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      VISUALSTORE_PASSWORD: "${VISUALSTORE_PASSWORD}"
      # PUID: "1000"   # the container runs as this user; it must own ./data and ./backups
      # PGID: "1000"   # (an empty directory is chowned on first start)
      # VISUALSTORE_COMPUTE_PROCESSES: "2"   # lower on a NAS to leave CPU for other services
      # FORWARDED_ALLOW_IPS: "172.18.0.2"    # your reverse proxy's address, so rate limiting
      #                                      # sees real client addresses (uvicorn setting)
    volumes:
      - ./data:/data          # must be a local disk, never a network share
      - ./backups:/backups
      - /volume1/Images:/media/images
      - /volume1/Photos:/media/photos
