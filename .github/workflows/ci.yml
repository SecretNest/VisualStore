name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run on a feature branch before merging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: System libraries for media tests
        run: |
          # GitHub runners occasionally hang in apt; bound each attempt and retry.
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y --no-install-recommends libvips42 ffmpeg; then exit 0; fi
            echo "apt attempt $attempt failed; retrying"; sleep 15
          done
          exit 1
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
        env:
          VISUALSTORE_TEST_REQUIRE_MEDIA: "1"  # libvips/ffmpeg are installed above: never skip

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Type-check
        run: cd web && npm run lint
      - name: Unit tests
        run: cd web && npm test
      - name: Build
        run: cd web && npm run build

  image:
    # Proves the Dockerfile builds (amd64 only) on every change and that the entrypoint drops
    # privileges as documented; publishing is manual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: test  # FROM runtime: the published stage is built as well
          push: false
          load: true
          tags: visualstore:test
      - name: Entrypoint drops to PUID/PGID with a writable HOME
        run: |
          out="$(docker run --rm -e PUID=1234 -e PGID=1234 visualstore:test sh -c 'id -u; id -g; echo $HOME' | tr '\n' ' ')"
          echo "$out"
          test "$out" = "1234 1234 /tmp "
      - name: Version reported by the image matches pyproject
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          reported="$(docker run --rm visualstore:test python -c 'import visualstore; print(visualstore.__version__)')"
          echo "pyproject $declared / image $reported"
          test "$declared" = "$reported"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System libraries
        run: |
          # GitHub runners occasionally hang in apt; bound each attempt and retry.
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y --no-install-recommends libvips42 ffmpeg; then exit 0; fi
            echo "apt attempt $attempt failed; retrying"; sleep 15
          done
          exit 1
      - name: Install
        run: uv sync --frozen && cd web && npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(cd web && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Browsers
        run: |
          cd web
          for attempt in 1 2 3; do
            if timeout 300 npx playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $attempt failed; retrying"; sleep 15
          done
          exit 1
      - name: End to end
        run: cd web && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
