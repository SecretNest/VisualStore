name: Build and publish Docker image

# Manual trigger only. The version comes from pyproject.toml unless typed into the form.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish. Leave empty to use [project].version from pyproject.toml."
        required: false
      force:
        description: "Publish even if the typed version differs from pyproject.toml (the image would report the pyproject version)."
        type: boolean
        default: false
      move_latest:
        description: "Also move the `latest` tag to this build. Leave off when republishing an older version."
        type: boolean
        default: true

# Two dispatches must not race on the `latest` and `buildcache` tags.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/secretnest/visualstore
  # ACR_REGISTRY is the Alibaba Cloud registry host (org secret); the repository path is fixed.
  ACR_IMAGE: ${{ secrets.ACR_REGISTRY }}/secretnest/visualstore

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          declared="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)"
          v="${INPUT_VERSION:-$declared}"
          case "$v" in
            '') echo "::error::No version found in pyproject.toml and none supplied."; exit 1 ;;
            *[!0-9.]*|.*|*.) echo "::error::Version '$v' is not a dotted numeric version."; exit 1 ;;
          esac
          if [ "$v" != "$declared" ] && [ "$INPUT_FORCE" != "true" ]; then
            echo "::error::Typed version '$v' differs from pyproject.toml ('$declared'); the image would report '$declared'. Bump pyproject.toml or tick 'force'."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.ACR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.move_latest }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestation manifests are rejected by ACR ("unknown manifest class"), so both stay off.
          provenance: false
          sbom: false
          # Cache lives in GHCR; the type=gha export runs after the push and has stalled builds.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
