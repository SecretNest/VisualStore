[project]
name = "visualstore"
version = "0.2.1"
description = "Self-hosted deduplication for image, animated-image and video libraries"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "onnxruntime>=1.17",
  "usearch>=2.9",
  "pyvips>=2.2",
]

[dependency-groups]
dev = [
  "httpx2>=2.16.0",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "onnx>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visualstore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", "web", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long literal lines in tests are fine; source stays at 100
