name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run on a feature branch before merging

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: System libraries for media tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42 ffmpeg
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: cd web && npm ci
      - name: Type-check
        run: cd web && npm run lint
      - name: Unit tests
        run: cd web && npm test
      - name: Build
        run: cd web && npm run build

  image:
    # Proves the Dockerfile builds (amd64 only) on every change; publishing is manual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          tags: visualstore:ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips42 ffmpeg
      - name: Install
        run: uv sync --frozen && cd web && npm ci
      - name: Playwright version
        id: pw
        run: echo "version=$(cd web && node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Browsers
        run: cd web && npx playwright install --with-deps chromium
      - name: End to end
        run: cd web && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
          if-no-files-found: ignore
